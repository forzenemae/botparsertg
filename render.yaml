services:
  - type: web
    name: avito-bot
    env: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHECK_INTERVAL
        value: 300
      - key: YOUR_TELEGRAM_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0