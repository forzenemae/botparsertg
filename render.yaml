services:
  - type: web
    name: avito-bot
    plan: free
    env: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps
    startCommand: python app.py
    envVars:
      - key: CHECK_INTERVAL
        value: 300
      - key: RAILPACK_PYTHON_VERSION
        value: 3.11.4
